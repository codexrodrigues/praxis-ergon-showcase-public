services:
  - type: web
    name: praxis-ergon-showcase
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      - key: SPRING_AUTOCONFIGURE_EXCLUDE
        value: "org.praxisplatform.uischema.configuration.BulkOperationLifecycleAutoConfiguration"
      - key: SPRINGDOC_CACHE_DISABLED
        value: "false"
      - key: SPRINGDOC_API_DOCS_GROUPS_ENABLED
        value: "true"
      - key: PRAXIS_OPENAPI_HTTP_READ_TIMEOUT
        value: "60s"
      - key: APP_OPENAPI_INTERNAL_BASE_URL
        value: "http://127.0.0.1:8080"
      - key: SHOWCASE_PUBLIC_READ_ENABLED
        value: "true"
      - key: SHOWCASE_CORS_ORIGINS
        value: "https://praxis-ergon-showcase.web.app,https://praxis-ergon-showcase.firebaseapp.com,http://localhost:4200,http://localhost:4310"
      - key: SHOWCASE_CONFIG_ORIGINS
        value: "https://praxis-ergon-showcase.web.app,https://praxis-ergon-showcase.firebaseapp.com,http://localhost:4200,http://localhost:4310"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: "ergon_showcase_bulk_runtime"
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CONFIG_DATASOURCE_URL
        sync: false
      - key: CONFIG_DATASOURCE_USERNAME
        value: "ps3b_config_runtime"
      - key: CONFIG_DATASOURCE_PASSWORD
        sync: false
      - key: CONFIG_DATASOURCE_SCHEMA
        value: "public"
      - key: PRAXIS_RESOURCE_VERSION_ETAG_SECRET
        generateValue: true
      - key: SHOWCASE_USERNAME
        value: "ergon"
      - key: SHOWCASE_PASSWORD
        sync: false
      - key: SHOWCASE_BULK_ADMIN_USERNAME
        value: "ergon-publication-admin"
      - key: SHOWCASE_BULK_ADMIN_PASSWORD
        sync: false
      - key: BULK_OWNER_USERNAME
        value: "neondb_owner"
      - key: BULK_CONTROL_PASSWORD
        sync: false
      - key: BULK_CURSOR_KEY
        sync: false
