name: CI & Render Cloud Deploy (Ergon Showcase)

on:
  push:
    branches:
      - main
    tags:
      - 'ergon-showcase-deploy-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_render:
        description: "Trigger Render deployment after CI passes"
        required: false
        default: false
        type: boolean

concurrency:
  group: ergon-showcase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, Offline Conformance Suite & Package (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify immutable deployment SDK inputs
        run: python3 scripts/workspace/verify-deployment-artifacts.py

      - name: Seed local Praxis dependencies into Maven repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.m2/repository
          cp -r .mvn/local-repo/io ~/.m2/repository/
          find ~/.m2/repository/io/github/codexrodrigues -name '_remote.repositories' -delete || true

      - name: Compile and run offline JUnit conformance & security test suite
        run: mvn -B test -Dtest=ErgonConfigAccessTest,TenantRequestValidationTest,ShowcaseCanonicalConformanceGateTest,ErgonPolicyStudioContractTest,ErgonReactiveDeterminationMetadataTest,ErgonBrowserSessionTest,ErgonBrowserConfigPostgresTest,ErgonConfigPrincipalsBindingTest,ErgonSessionCookieConfigurationTest

      - name: Package Spring Boot executable JAR
        run: mvn -B package -DskipTests

      - name: Verify runtime Docker image build
        run: |
          docker build -f Dockerfile.prebuilt -t praxis-ergon-showcase:${GITHUB_SHA} .
          docker build -f Dockerfile -t praxis-ergon-showcase-source:${GITHUB_SHA} .

  deploy-render:
    name: Deploy to Render (Starter) & Smoke Health Check
    needs: ci
    if: >-
      startsWith(github.ref, 'refs/tags/ergon-showcase-deploy-') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_render))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v5

      - name: Deploy exact source commit and require candidate health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python3 scripts/workspace/deploy-render.py
