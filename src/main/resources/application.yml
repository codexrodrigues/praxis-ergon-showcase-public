server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
spring:
  application:
    name: praxis-ergon-showcase
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  ai:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  swagger-ui:
    oauth2-redirect-url: http://localhost:${PORT:${SERVER_PORT:8080}}/swagger-ui/oauth2-redirect.html
  cache:
    disabled: ${SPRINGDOC_CACHE_DISABLED:false}
  api-docs:
    version: OPENAPI_3_0
    groups:
      enabled: ${SPRINGDOC_API_DOCS_GROUPS_ENABLED:true}
  writer-with-order-by-keys: true
app:
  openapi:
    internal-base-url: ${APP_OPENAPI_INTERNAL_BASE_URL:}
config:
  datasource:
    url: ${CONFIG_DATASOURCE_URL}
    username: ${CONFIG_DATASOURCE_USERNAME}
    password: ${CONFIG_DATASOURCE_PASSWORD}
    schema: ${CONFIG_DATASOURCE_SCHEMA:public}
praxis:
  openapi:
    http:
      read-timeout: ${PRAXIS_OPENAPI_HTTP_READ_TIMEOUT:60s}
  ai:
    registry:
      bootstrap:
        enabled: false
      health:
        enabled: false
  stats:
    enabled: true
  resource-version:
    etag:
      secret: ${PRAXIS_RESOURCE_VERSION_ETAG_SECRET}
  domain-catalog:
    auto-sync:
      enabled: false
      groups:
        - ergon
showcase:
  security:
    username: ${SHOWCASE_USERNAME}
    password: ${SHOWCASE_PASSWORD}
    public-read-enabled: ${SHOWCASE_PUBLIC_READ_ENABLED:false}
    cors-origins: ${SHOWCASE_CORS_ORIGINS:https://praxis-ergon-showcase.web.app,https://praxis-ergon-showcase.firebaseapp.com,http://localhost:4200,http://localhost:4303,http://localhost:4310}
    config-origins: ${SHOWCASE_CONFIG_ORIGINS:https://praxis-ergon-showcase.web.app,https://praxis-ergon-showcase.firebaseapp.com,http://localhost:4200,http://localhost:4303,http://localhost:4310}
    policy-read-orgs: ${SHOWCASE_POLICY_READ_ORGS:}
    policy-publish-orgs: ${SHOWCASE_POLICY_PUBLISH_ORGS:}
